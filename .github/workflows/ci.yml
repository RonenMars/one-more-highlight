name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verify
        run: pnpm verify

  visual:
    name: Visual Regression
    needs: [verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual tests
        run: pnpm test:visual

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diff
          path: tests/visual/test-results/
          retention-days: 7

  release:
    name: Release
    needs: [verify, visual]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # OIDC trusted publishing needs npm >= 11.5.1; Node 24 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Release
        env:
          # `main` is protected by the `main protection` ruleset, and
          # @semantic-release/git's prepare step pushes the chore(release)
          # commit straight to it. GITHUB_TOKEN pushes as github-actions[bot],
          # an actor no bypass covers, so the push is refused with
          # `GH013: Repository rule violations found for refs/heads/main`
          # ("Changes must be made through a pull request" AND "2 of 2 required
          # status checks are expected") and the release dies in prepare —
          # before npm publish, so nothing is half-released. RELEASE_PAT is a
          # fine-grained PAT owned by a repo admin, the actor the ruleset's
          # always-mode bypass does cover. Without the secret this falls back to
          # GITHUB_TOKEN and the push fails as described above.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # OIDC is attempted first (id-token: write). NPM_TOKEN is the fallback:
          # trusted publishing is not configured for this package on npmjs.com, so
          # the OIDC exchange returns 404 "package not found" and ENONPMTOKEN.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Disable husky so commitlint does not run on semantic-release's
          # auto-generated release commit — its changelog lines (GitHub commit
          # and issue URLs) exceed commitlint's 100-char footer limit and were
          # failing `git commit`, blocking the version bump and npm publish.
          HUSKY: 0
        run: npx semantic-release
